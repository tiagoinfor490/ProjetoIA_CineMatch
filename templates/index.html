<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch - Seu Recomendador de Filmes</title>
    <link rel="stylesheet" href="../static/style.css">
</head>

<body>

    <div class="container">
        <h1>CineMatch</h1>
        <p class="subtitle">Escolha um filme que você gosta e veja a mágica!</p>
        <div class="input-group">
            <div style="position: relative; width: 100%; text-align: left;">
                <input type="text" id="filme-usuario" placeholder="Digite o nome de um filme (ex: Matrix)..."
                    autocomplete="off"
                    style="width: 100%; padding: 12px; border-radius: 5px; border: none; background-color: #333; color: white; font-size: 1rem; box-sizing: border-box; outline: none;">

                <div id="caixa-sugestoes"
                    style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background-color: #222; border: 1px solid #444; border-radius: 0 0 5px 5px; max-height: 200px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                </div>
            </div>

            <button onclick="buscarRecomendacoes()" style="margin-top: 20px; width: 100%;">Encontrar
                Semelhantes</button>
        </div>
        <div style="margin-top: 20px; text-align: left; background: #222; padding: 15px; border-radius: 10px;">
            <h4 style="margin: 0 0 10px 0; color: var(--primary-color);">🍿 Meu Histórico (Já Assistidos):</h4>
            <div id="lista-historico"
                style="display: flex; flex-wrap: wrap; gap: 10px; color: var(--text-gray); font-size: 0.9rem;">
                <em>Nenhum filme assistido ainda.</em>
            </div>
            <button onclick="limparHistorico()"
                style="margin-top: 15px; padding: 5px 10px; font-size: 0.8rem; background-color: #333;">Limpar
                Histórico</button>
        </div>

        <div id="lista-recomendacoes"></div>
    </div>
    <script src="../static/script.js"></script>
</body>

</html>
